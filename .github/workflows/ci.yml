name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.10"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.12"
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Canonical repository validation
        run: python scripts/validate_repo.py
      - name: Direct unittest discovery
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Validate tracked JSON
        run: python scripts/validate_json.py
      - name: Repository consistency checks
        run: python -m unittest tests.test_repository_consistency -v
